[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# cargo will default to `package.name`, which is what we want.
path = "src/lib.rs"

[features]
default = []
open-telemetry = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-appender-tracing",
    "opentelemetry-otlp",
    "opentelemetry-semantic-conventions",
]

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
figment = { version = "0.10", features = ["yaml", "env"] }
serde-aux = "4.5"
actix-web = "4"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-actix-web = "0.7"
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "logs",
    "internal-logs",
    "http-proto",
    "reqwest-blocking-client",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", features = [
    "semconv_experimental",
], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
secrecy = { version = "0.10", features = ["serde"] }
unicode-segmentation = "1.12.0"
validator = "0.21"
rand = { version = "0.10", features = ["std_rng"] }
thiserror = "2"
anyhow = "1"
argon2 = { version = "0.5.3", features = ["std"] }
actix-web-flash-messages = { version = "0.5", features = ["cookies"] }
actix-session = { version = "0.11", features = ["redis-session-rustls"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "cookies",
    "form",
] }
# Preserve the existing Ring provider instead of adopting Reqwest 0.13's new AWS-LC default.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.11"
const-hex = "1.14.0"

# used exclusively for testing, not compiled in release binary
[dev-dependencies]
claims = "0.8"
fake = "5"
proptest = "1"
wiremock = "0.6.2"
linkify = "0.11"
serde_urlencoded = "0.7.1"
